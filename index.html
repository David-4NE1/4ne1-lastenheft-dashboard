<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#f8fafc}
textarea,select,input,button{font-family:inherit}
#error{color:red;padding:20px;font-size:14px;white-space:pre-wrap}

<body>
<div id="login" style="display:flex;justify-content:center;align-items:center;height:100vh;background:#0f172a;font-family:Inter,system-ui,sans-serif">
<div style="text-align:center;color:white">
<h1 style="font-size:28px;margin-bottom:8px">4NE-1 Gen4</h1>
<p style="color:#94a3b8;margin-bottom:24px">Requirements Dashboard</p>
<input id="pw" type="password" placeholder="Passwort eingeben..." style="padding:12px 20px;border-radius:8px;border:2px solid #334155;background:#1e293b;color:white;font-size:16px;width:250px;text-align:center" onkeydown="if(event.key==='Enter')checkPw()">
<br><br>
<button onclick="checkPw()" style="padding:10px 32px;border-radius:8px;border:none;background:#2563eb;color:white;font-size:16px;cursor:pointer;font-weight:600">Login</button>
<p id="pw-error" style="color:#ef4444;margin-top:12px;display:none">Falsches Passwort</p>
</div>
</div>
<script>
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')checkPw()});
function checkPw(){
  var pw=document.getElementById('pw').value;
  if(pw==='%Foranyone-Gen4%'){
    document.getElementById('login').style.display='none';
    document.getElementById('loading').style.display='block';
    document.getElementById('root').style.display='block';
    sessionStorage.setItem('4ne1-auth','ok');
  } else {
    document.getElementById('pw-error').style.display='block';
  }
}
// Auto-login if already authenticated in this session
if(sessionStorage.getItem('4ne1-auth')==='ok'){
  document.addEventListener('DOMContentLoaded',function(){
    document.getElementById('login').style.display='none';
    document.getElementById('loading').style.display='block';
    document.getElementById('root').style.display='block';
  });
}
</script>
<div id="loading" style="display:none">Loading dashboard...</div>
<div id="error"></div>
<div id="root" style="display:none"></div>
<script>
window.onerror=function(msg,url,line,col,err){
  document.getElementById('error').textContent='ERROR: '+msg+'\nLine: '+line+'\nCol: '+col;
  document.getElementById('loading').style.display='none';
};
</script>

<script>

  document.getElementById('loading').style.display='none';
}
</script>

all compute units has not yet been demonstrated.","cr":"VLA training on inconsistent data","ch":"7. Open Points"},"OP-28":{"r":"Target PL/SIL per safety function and reaction times (STO, MRM) not defined.","cr":"Certification path and architecture cannot be validated","ch":"7. Open Points"},"OP-30":{"r":"Limit for temperature rise in the heat run (EOL-THR-01) is TBD.","cr":"EOL test cannot be assessed","ch":"7. Open Points"},"OP-31":{"r":"Number of torso stereo cameras (1x or 2x) not decided.","cr":"Serializer, GMSL, and capture design open","ch":"7. Open Points"},"OP-32":{"r":"Torso and pelvis depth sensor not decided (DepthVista vs. RoboSense AC1 vs. ZED X Mini OEM).","cr":"Installation space, interface, and calibration concept open","ch":"7. Open Points"},"OP-33":{"r":"The 4 PoE/TSN camera ports (poe1–poe4) are unassigned under the MIPI/GMSL camera architecture.","cr":"Switch resources unused, or port assignment incorrectly frozen","ch":"7. Open Points"},"OP-34":{"r":"Head geometry for the 2x 120° stereo pair (baseline distance, convergence, tilt) not determined; the 60° design applied to a single camera.","cr":"Manipulation-space coverage not demonstrated","ch":"7. Open Points"},"OP-36":{"r":"OBSOLETE/RE-ASSESS: migration of the drive interface was answered by the decision of 12.08.2026 (EtherCAT intra-limb via 1G T1 ring, 10G-","cr":"Re-assess against 4NE1-9005","ch":"7. Open Points"},"OP-37":{"r":"Carrier board R2.0 offers only 4 GMSL2 links (1x MAX96724); 9 camera channels are planned.","cr":"Camera plan 4.4 cannot be implemented without a second deserializer or a second carrier","ch":"7. Open Points"},"OP-38":{"r":"Role delineation of the IMUs (carrier IMU, torso IMU, joint IMU) is not defined.","cr":"Redundancy and safety argumentation unclear","ch":"7. Open Points"},"OP-39":{"r":"Time reference for data-stream timestamps is not defined; only one RTC (MCP7940NT) exists on the carrier.","cr":"The <5–10 ms requirement (SWL-02) cannot be demonstrated","ch":"7. Open Points"},"OP-41":{"r":"Units in the camera geometry sketch (d_rt = 25, h_t = 92) are given as m; cm is plausible; also 92 cm vs. the earlier 95 cm table height.","cr":"Coverage calculation based on incorrect assumptions","ch":"7. Open Points"},"OP-42":{"r":"Storage capacity of the NVMe SSD on the PCIe switch board is not specified.","cr":"Data-recording duration in the field cannot be planned","ch":"7. Open Points"},"OP-43":{"r":"Capacity of the two NVMe SSDs (Thor and real-time domain) not specified.","cr":"Data-recording duration and model size cannot be planned","ch":"7. Open Points"},"OP-44":{"r":"Migration from NeuraLinux 1.8 to 2.0 is not planned (scope, timing, fallback).","cr":"Gen4 commissioning without a defined software base","ch":"7. Open Points"},"OP-45":{"r":"In the target design, the head and torso have no dedicated controller (4x Smart Limb = 2x arm, 2x leg). The QC proposal additionally named a QCS Head.","cr":"Head sensors and torso actuation without an assigned real-time unit","ch":"7. Open Points"},"OP-46":{"r":"The 3x MIPI fisheye and 2x MIPI stereo cameras in the head need a capture path; the target design assigns no compute unit to the head.","cr":"Camera architecture 4.4 cannot be mapped (in addition to OP-37)","ch":"7. Open Points"},"OP-49":{"r":"TSN characteristics for the optical limb backbone and the T1 rings are not quantified (gPTP accuracy, TAS schedule, ring switchover time, latency/jitter).","cr":"NET-13/14/15 cannot be verified; control cycle time cannot be sized","ch":"7. Open Points"},"OP-50":{"r":"Ring protocol for the T1 ring not defined (FRER, MRP, or EtherCAT ring redundancy).","cr":"Redundancy behavior and switchover time undetermined","ch":"7. Open Points"},"OP-51":{"r":"Contradiction in the Gen3 history: Confluence names IQ10 as the Gen3 host, the project documentation names NXP and later QCS-6490.","cr":"Spare-part and software maintenance for Gen3 rest on unclear grounds","ch":"7. Open Points"},"OP-52":{"r":"Gen3 has no dedicated safety controller; all safety functions are new for Gen4.","cr":"There is no standards-compliant safety proof for Gen3 — check the impact on ongoing production","ch":"7. Open Points"},"OP-53":{"r":"Maximum delay and bandwidth budget for the cloud log transmission are not defined; behavior on connection loss (buffering, resend","cr":"CMP-12 and SWL-13 cannot be verified; cellular costs and data volume unknown","ch":"7. Open Points"},"OP-54":{"r":"Capacity and lifetime of the logging SD card during continuous operation with cloud sync have not been assessed.","cr":"Failure of the logging storage medium in the field","ch":"7. Open Points"},"OP-56":{"r":"UWB function is defined without a target value (positioning accuracy, anchor concept, number of antennas).","cr":"NET-18 cannot be verified; safety use of the near-field positioning unclear","ch":"7. Open Points"},"OP-57":{"r":"Gen3 has no uniform Wi-Fi specification across build states; radio approvals differ per build state.","cr":"Market access and serviceability of the Gen3 fleet unclear","ch":"7. Open Points"},"OP-58":{"r":"QC-1: WL_EN/BT_EN/SW_CTRL are driven via the GPIOs of the XR17V352 PCIe-UART bridge, not via native SoC GPIOs. Qualcomm must confirm that th","cr":"Without approval, no schematic capture for the Wi-Fi path","ch":"7. Open Points"},"OP-59":{"r":"QC-2: Bluetooth HCI runs via the XR17V352 as a virtual COM port instead of a native SMARC UART. Tolerance of the BT stack to the additional","cr":"BT function and audio not assured","ch":"7. Open Points"},"OP-60":{"r":"QC-3: BT audio only in-band via HCI/SCO; I2S/PCM pins remain unconnected. Full support and elimination of any firmware dependency on PCM","cr":"Voice output/input via BT restricted","ch":"7. Open Points"},"OP-61":{"r":"QC-4/QC-5: unclear whether PCIe_C/D on the QCS6490 trains as a genuine Gen3 x2 link on a switch upstream port, or as two independent x1 controllers","cr":"Switch upstream configuration and throughput of all four endpoints cannot be designed","ch":"7. Open Points"},"OP-62":{"r":"Reference-clock distribution and PERST#/WAKE# fan-out: on the X3501 there is one shared line each for the entire 2-lane interface. Distribution to four D","cr":"Link training of the endpoints not assured","ch":"7. Open Points"},"OP-63":{"r":"Antenna routing, RF keep-out, coexistence with the existing XBee module on mainboard 8013, and radio approval (FCC/CE) for the QCA6797AQ are open","cr":"Approval risk and mutual interference between the radio links","ch":"7. Open Points"},"OP-64":{"r":"12 V pass-through at MCIO-OUT: protection level not defined; the 12 V rail of the 8013 has a total capacity of 10 A across all loads.","cr":"Overload of the mainboard supply possible","ch":"7. Open Points"},"OP-65":{"r":"Relationship between assemblies 4NE1-9004 (architecture spec, 05.07.2026) and 4NE1-9006 (schematic R1.0, 23.07.2026) is unclear — both use the PI7C9X3G6","cr":"Duplicate development or incorrect part booking possible","ch":"7. Open Points"},"OP-66":{"r":"PCIE_3V3_AUX on X3501 is not a supply source for 9004; the available current budget of this auxiliary rail on the 8013 is unconfirmed.","cr":"Incorrect design of pull-ups and housekeeping","ch":"7. Open Points"},"OP-67":{"r":"The UHRRC is specified with Wi-Fi 6 (802.11ax); the robot targets Wi-Fi 7. Whether the HMI and robot must use the same radio generation is not","cr":"Throughput and latency of teleoperation, as well as the approval strategy, are affected","ch":"7. Open Points"},"OP-69":{"r":"According to the vendor, the safety certification of the UHRRC is still under assessment; the NRE share for functional safety is explicitly in progress.","cr":"No firm schedule and cost framework for the safety proof of the control device","ch":"7. Open Points"},"OP-70":{"r":"Reaction time of the emergency stop via HMI and via radio is not defined; the safety protocol over the sub-GHz channel, which is considered insecure, is not","cr":"SAF-11 through SAF-13 and EOL-HMI-04/05 cannot be verified","ch":"7. Open Points"},"OP-71":{"r":"Price discrepancy: SECO offer 20005380 states EUR 1,200 per HMI, the SECO proposal EUR 1,140 (EUR 60 difference per unit at 5,000 units).","cr":"Budget difference of EUR 300,000 over the call-off quantity","ch":"7. Open Points"},"OP-72":{"r":"The SBC offer names the QC5430 as the basis, while the compute target architecture is the QCS-6490. The relationship between the two variants (SECO SMARC QCS6490/5430) needs to be clarified.","cr":"Incorrect platform assumption in software planning and procurement","ch":"7. Open Points"},"OP-73":{"r":"Both SECO offers carry a 2027 call-off obligation (5,000 HMI, 25,000 SBC) and were only valid until 10.07.2026.","cr":"Price and quantity commitment unclear; renegotiation required","ch":"7. Open Points"},"OP-74":{"r":"The energy content of the Gen3 battery pack is not documented. Without it, no average power figure can be derived from the verified runtime of 6.5 h","cr":"The Gen4 runtime target remains an estimate","ch":"7. Open Points"},"OP-75":{"r":"The utilization levels of the load-case matrix (jumping, fall arrest with the arms, standing up from lying down, standing up from a chair, walking with maximum payload) are assumptions","cr":"DC link, fuses, and conductor cross-sections sized on an unsubstantiated basis; the governing load case","ch":"7. Open Points"},"OP-76":{"r":"The mechanical housing modification of the 300 Nm knee axis (XL) has been commissioned at Leili, but NEURA still needs to provide the drawing with interface dimensions and mounting","cr":"Knee integration blocked; Leili cannot proceed to production","ch":"7. Open Points"},"OP-77":{"r":"It is not clarified whether the Leili modules can support TSN and single-pair Ethernet. The fallback is EtherCAT via the T1 ring.","cr":"The network architecture of the smart limbs depends on this","ch":"7. Open Points"},"OP-78":{"r":"Numeric values for the module acceptance criteria are open: tolerance for speed/torque, backlash, repeatability, connector-lock pull-out force, accuracy","cr":"Module EOL at the supplier cannot be accepted","ch":"7. Open Points"},"OP-79":{"r":"Specification of the foot ToF sensors open: range, measurement rate, and accuracy at a resolution of at least 30 pixels per sensor.","cr":"FUS-04 cannot be accepted; terrain detection cannot be designed","ch":"7. Open Points"},"OP-80":{"r":"Measurement rate and accuracy of the central strain-gauge rosette are not defined. A high rate should be targeted for balance control.","cr":"FUS-03 cannot be accepted; CoP control cannot be designed","ch":"7. Open Points"},"OP-82":{"r":"Network requirements NET-01 through NET-19 need to be assessed against the Ethernet switch board 4NE1-9005; the individual component points of the superseded plan","cr":"Partly moot, partly still valid — without a reassessment the status remains unclear","ch":"7. Open Points"},"OP-84":{"r":"For the mainboard, schematic revision v0.3 (DRAFT) is available, while Rev C is in production. The changes between v0.3 and Rev C are not documented.","cr":"Component and port data in 17_HW_Boards and 08_Networking 08.3 may deviate from the production state","ch":"7. Open Points"},"OP-85":{"r":"The TSN feature set of the Q6223M is not documented: 802.1AS/gPTP accuracy, time-aware shaping, frame preemption, and FRER. Requirements NET-01, N","cr":"Determinism and redundancy of the network cannot be demonstrated","ch":"7. Open Points"},"OP-86":{"r":"Cascade topology of the three Q6223M switches on the 4NE1-9005 is not documented (uplink ports between the switches, bandwidth per stage).","cr":"Bottlenecks in the data path not identifiable; latency budget cannot be calculated","ch":"7. Open Points"},"OP-87":{"r":"The assignment of ports to host uplink, motion, and smart limbs is not consistently named in the schematic; the software naming convention from 6.8 is n","cr":"Risk of confusion between the schematic, device tree, switch software, and manufacturing test","ch":"7. Open Points"},"OP-88":{"r":"Only two legacy 100BASE-T ports (P3/P4) are available. Whether this is sufficient for the intended legacy loads has not been checked.","cr":"Port shortage would require a redesign","ch":"7. Open Points"},"OP-88b":{"r":"Four power and data distribution boards (pelvis, 2x thigh, 2x upper arm, head — six installations) need to be newly developed. Numbering scheme, specifi","cr":"Wiring harness, power distribution, and limb network cannot be finalized","ch":"7. Open Points"},"OP-89":{"r":"The current allocation per distribution board is not determined (leg current per leg, arm current per arm, head current including stepper motors).","cr":"Conductor cross-sections, fuses, and connectors cannot be sized","ch":"7. Open Points"},"OP-90":{"r":"The optional population of the head board with two stepper-motor drivers is not decided: axes, motor type, current demand, and control connection off","cr":"Head kinematics and head power supply undetermined","ch":"7. Open Points"},"OP-91":{"r":"The network connection of the distribution boards is not defined: whether they run as subnodes in the T1 rings or distribute passively; for the head","cr":"Ring topology, address plan, and time synchronization affected","ch":"7. Open Points"},"OP-92":{"r":"For board 4NE1-9004, only architecture spec Rev 0.1 (05.07.2026, status DRAFT, explicitly not released for layout) is available, even though the b","cr":"Component and port data in this set may deviate from the production state","ch":"7. Open Points"},"OP-93":{"r":"Head stepper motors would require a movable head kinematic. EOL-SEP-21, in contrast, requires a rigidly fixed head camera without actuated movement","cr":"Contradiction between head actuation and the camera requirement","ch":"7. Open Points"},"OP-95":{"r":"Specification of the foot data-acquisition board is missing: sampling rates for the rosette and ToF, timestamping method, power supply, installation space in the foot, and degree of protection","cr":"FUS-03, FUS-04, and FUS-09 cannot be accepted","ch":"7. Open Points"},"OP-96":{"r":"Vibration-damped suspension of all PCBs is set as a target but not designed: excitation spectrum from walking and actuation, target natural","cr":"MEC-17 and EOL-VIS-06 cannot be accepted; installation-space requirement per assembly unknown","ch":"7. Open Points"},"OP-97":{"r":"The elastic suspension generates relative motion. Effects on connectors, cable strain relief, the thermal path, and the ground path/EMC have not been","cr":"Cable breakage, heat buildup, or EMC problems in the field","ch":"7. Open Points"},"OP-98":{"r":"Test profile and limit values for the vibration test (EOL-THR-03) are not defined.","cr":"Effectiveness of the damping cannot be demonstrated","ch":"7. Open Points"},"OP-99":{"r":"The load-case list may be incomplete: climbing stairs, arm-supported fall arrest, standing up from a crouch with payload, and dynamic braking","cr":"A load case not considered could exceed 523.7 A and invalidate the design","ch":"7. Open Points"},"OP-100":{"r":"TARGET CONFLICT: cooling requires a fixed thermal coupling of the assemblies to the chest structure, while MEC-17 requires a vibration-damped suspension","cr":"Either insufficient cooling or insufficient vibration decoupling — both endanger the service life","ch":"7. Open Points"},"OP-101":{"r":"The heat input per domain (Central Brain, real-time, safety) and the maximum ambient temperature are not specified. Without both, the cooling circuit","cr":"THM-08 cannot be accepted; risk of performance throttling in the field","ch":"7. Open Points"},"OP-102":{"r":"The thermal interface to the chest structure is not defined: contact pressure, thermal interface material, permissible thermal contact resistance, tolerances, an","cr":"THM-07 cannot be accepted; heat transfer not repeatable","ch":"7. Open Points"},"OP-103":{"r":"Circuit components are not defined: pump, radiator, expansion tank, coolant, installation locations, and redundancy. Also, behavior in the event of pump failure","cr":"Cooling failure without a defined fallback; coolant leakage onto the electronics","ch":"7. Open Points"},"OP-105":{"r":"Dedicated rules are missing for bolted joints on elastically suspended PCBs — the preload must not bridge the vibration damping.","cr":"MEC-17 could be rendered ineffective by the bolting","ch":"7. Open Points"},"OP-106":{"r":"For the torque-angle method, the clamp-length ratios l_K/d of the load-bearing joints are missing. The 90° guideline value is not confirmed.","cr":"Torque-angle tightening cannot be released; preload-force scatter unknown","ch":"7. Open Points"},"OP-107":{"r":"Cable-specific limit values are missing: minimum static and dynamic bend radius, number of bending cycles in moving axes, spacing between power and signal lines,","cr":"CAB-04 through CAB-09 cannot be accepted; cable failure in moving axes is a known risk","ch":"7. Open Points"},"OP-108":{"r":"Discharge time and permissible residual voltage of the DC link after disconnection are not defined (4.7 mF capacitors in the hip area).","cr":"SAF-W-03 cannot be tested; hazard to service personnel","ch":"7. Open Points"},"OP-109":{"r":"Time values of the emergency-stop system are not defined: reaction time from button press to torque-free state, heartbeat cycle time, and detection time of the","cr":"EST-01, EST-04, EST-05, and EOL-EST-01/04 cannot be tested; no proof per ISO 13849 possible","ch":"7. Open Points"},"OP-110":{"r":"The security protocol of the 868 MHz FHSS link is not specified (sequence number, timestamp, timeout, acknowledgment, cryptographic protection","cr":"EST-07 cannot be demonstrated; wireless emergency stop without solid safety evidence","ch":"7. Open Points"},"OP-111":{"r":"Range, behavior under signal shadowing, and the rule for multiple control devices per robot are open.","cr":"EST-11, EST-12, and EST-13 cannot be accepted","ch":"7. Open Points"},"OP-112":{"r":"Fabric properties are not defined: abrasion resistance, tear propagation resistance, wash temperature, shape stability over wash cycles, and fire behavior.","cr":"VER-02, VER-03, and VER-11 cannot be accepted; supplier selection not possible","ch":"7. Open Points"},"OP-113":{"r":"The sensor transparency of the suit is not designed: cutouts for cameras, LiDAR, and ToF, acoustic transparency for microphones and speak","cr":"VER-06 cannot be demonstrated; the sensor system could be rendered useless by the suit","ch":"7. Open Points"},"OP-114":{"r":"The solution for hands and arms needs to be coordinated with the Dexterous Manipulation business unit (Munich), including support for third-party hands and the interfa","cr":"VER requirements for arms and hands undetermined; tactile sensing at risk","ch":"7. Open Points"},"OP-115":{"r":"Whether the feet are designed symmetrically or asymmetrically has not been decided.","cr":"Foot geometry, cover, and spare-parts stocking affected","ch":"7. Open Points"},"OP-116":{"r":"The handheld transmitter and the HMI act on the same robot-side shutdown path. This shared path is the single point of failure and must be assessed per ISO 13849","cr":"Two trigger sources increase availability, but not necessarily the performance level","ch":"7. Open Points"},"OP-117":{"r":"Device specification of the handheld emergency-stop transmitter open: form factor, controls, power supply and charging concept, range, degree of protection, radio approval.","cr":"EST-10 and EST-15 cannot be accepted","ch":"7. Open Points"},"OP-118":{"r":"Contradiction in the axis count: 01_System_Overview SYS-03 states 22 actuated axes for Gen3, 04_Actuation lists 32 actuators for Gen3. Whether axes wi","cr":"Axis count, DoF figure in the benchmark, and wiring-harness planning rest on unclear grounds","ch":"7. Open Points"},"OP-119":{"r":"FHSS parameters are not defined: number of channels, hopping sequence and its derivation from the pairing ID, dwell time per channel. These values determine","cr":"EST-16 cannot be accepted; relationship to heartbeat and reaction time (OP-109) undetermined","ch":"7. Open Points"},"OP-120":{"r":"The regulatory requirements for FHSS operation in the 868 MHz SRD band (duty cycle, ERP, channel occupancy) need to be reviewed and evidence provided.","cr":"EST-17 open; radio approval and thus market access affected","ch":"7. Open Points"},"RSK-01":{"r":"Software delivery to Pre-Series — Pre-Series receives the finished package; if it is not delivered on time/stably → production stalls","cr":"SW pipeline reliable","ch":"6.5 Project Risks"},"RSK-02":{"r":"System mass >100 kg (target <70 kg) — critical path, simulation needed","cr":"Mass < 70 kg","ch":"6.5 Project Risks"},"RSK-03":{"r":"No magnesium — fire hazard, exacerbates RSK-02","cr":"Alternative material viable","ch":"6.5 Project Risks"}};
var SECTIONS=[{"l":0,"t":"","p":"{width=\"2.5in\" height=\"0.5819674103237096in\"}\n**Technical Requirement Specifications**\n4NE-1 Humanoid Robot \u2014 Generation 4\n\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014--\n**Document Status**                 DRAFT\n\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014-- \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014--\n**Version**                         0.1\n**Date**                            2026-09-11\n**Product**                         4NE-1 Gen4 Humanoid Robot\n**Author**                          [Name]\n**Classification**                  NEURA Robotics \u2014 CONFIDENTIAL\n**Template Reference**              Mercedes-Benz TM CompSpec (GC) STM\nBL V7.0 R22.6, adapted for robotics\n**Source Data**                     4NE1-GEN4-SPECS.xlsx v0.2\n**Meeting Reference**               Gen4 Pre-Series Planning,\n10.09.2026, Zurich\n\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014--\nBlue text = values from the Excel specification"},{"l":1,"t":"Revision History","p":"\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014--\n**Version**       **Date**          **Description**   **Author**\n\u2014\u2014\u2014\u2014\u2014-- \u2014\u2014\u2014\u2014\u2014-- \u2014\u2014\u2014\u2014\u2014-- \u2014\u2014\u2014\u2014\u2014--\n0.1               2026-09-11        Initial draft \u2014 [Name]\nfrom Excel v0.2 +\n\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014--"},{"l":1,"t":"Table of Contents","p":"*(Right-click \u2192 Update Field \u2192 Update Entire Table in Word)*"},{"l":1,"t":"1 Introduction","p":""},{"l":2,"t":"1.1 Document Landscape","p":"This document is the Technical Requirement Specification (Lastenheft)\nfor the 4NE-1 Humanoid Robot, Generation 4. It defines all requirements\nthat the product must fulfil. The structure follows the Mercedes-Benz TM\nCompSpec template, adapted for humanoid robotics.\nSource data: 4NE1-GEN4-SPECS.xlsx v0.2, dated 24.08.2026, authored by\nMarcellinus Meyer. All values in blue are from this Excel. Values marked\n[TBD] on yellow are open."},{"l":3,"t":"1.1.1 Document Hierarchy","p":"\u2022 4NE1-GEN4-SPECS.xlsx \u2014 Source specification workbook (21 tabs)\n\u2022 Meeting Protocol 10.09.2026 Zurich \u2014 Gen4 Pre-Series Planning\n\u2022 Q-Gate Deliverables (Master Map) \u2014 Advanced DEV \u2192 Pre Series \u2192\nSeries Design \u2192 Series Process\n\u2022 EOL Checklist V03.13 \u2014 End-of-line test criteria Gen3.1 baseline\n\u2022 Confluence: 4NE-1 Compute & Sensors \u2014 Architecture reference"},{"l":3,"t":"1.1.2 Spec Freeze Policy","p":"Decision from Meeting 10.09.2026 (item 2.1): Specifications must not be\nchanged after QG0 for version 4.0. Any change requires a new version\n(4.x) with a gate process.\nDecision 3.3: SW updates that alter specifications also trigger a new"},{"l":3,"t":"1.1.3 Logistics & Transport Requirements","p":"Decision 2.4 (Meeting 10.09.2026): Product must be removable from\npackaging without a crane (reference: Agibot).\n**[PLACEHOLDER \u2014 Transport & Packaging Specification]**\n-   **[Packaging concept (dimensions, materials, stacking)]**\n-   **[Transport conditions (temperature, humidity, vibration)]**\n-   **[Maximum drop height / shock]**\n-   **[+ 2 more items to define]**"},{"l":3,"t":"1.1.4 Tools & Equipment","p":"Meeting 10.09.2026: Cables must be routed in CREO (decision 5.1).\nAssembly instructions must be documented (action 7.2).\n**[PLACEHOLDER \u2014 Tool & Equipment List]**\n-   **[Assembly tools per station (torque tools per SCR class, see\n-   **[Calibration equipment (camera, IMU, encoder)]**\n-   **[Test fixtures (EOL stations)]**\n-   **[+ 3 more items to define]**"},{"l":2,"t":"1.2 General Specifications","p":""},{"l":3,"t":"1.2.1 Requirement Attributes","p":"Every requirement row carries the following mandatory attributes (from\n\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014--\n**ID**                              Prefix per category: SYS-, MEC-,\nACT-, SEN-, CMP-, NET-, SWL-, SAF-,\nPWR-, VER-, FUS-, LOK-, LEI-, DES-,\n\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014-- \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014--\n**Requirement**                     \\\"Shall\\\" statement, one\nrequirement per row,\nsolution-neutral\n**Criterion (Pass/Fail)**           Measurable: number + unit +\ntolerance, or unambiguous yes/no\n**Verification**                    A = Analysis, I = Inspection, T =\nTest, D = Demonstration\n**Gen3 Actual**                     Measured value or configuration of\nthe Gen3/Gen3.1 production variant\n**Gen4 Target**                     Target value; TBD only with entry\n**Benchmark**                       Best known competitor value from"},{"l":3,"t":"1.2.2 Colour Coding","p":"\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014--\n**Blue text**                       Hard input value from Excel \u2014\ndata entry point\n\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014-- \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014--\n**Black text**                      Formula, derived value, or\nstructural content\n**Green text (in Excel)**           Cross-reference to another tab\n**Yellow fill**                     TBD / decision open \u2014 see Open\n\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014--"},{"l":1,"t":"2 Scope of Services --- Product Specification","p":""},{"l":2,"t":"2.1 System Overview & Top-Level Specifications","p":"Source: 01_System_Overview. Key decisions from Meeting 10.09.2026:\n-   Gen 4.0 goal: >80% of Gen3 problems solved. Capability to produce\nhigh quantities.\n-   Gen 4.0 = Fasttrack (same SW as 3.1.1); 4.1 = more cameras; 4.2 =\nSmart Limbs (HW in 4.0 but not activated).\n-   Use Cases Gen 4.0: walking, working, stairs. No jumping.\n-   Current weight: >100 kg \u2014 mechanical/structural and thermal\nsimulation required (critical path).\n-   Single source actuators (final decision). No magnesium (fire risk,\nCE \u2014 decision 1.2).\n-   Compute: T5000 = central AI; QCS6490 = RT + 4 satellites = 6 compute\nunits. Head has no own compute.\n\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014--\n**ID**   **Kategorie**        **Requirement (soll)**       **Kriterium /        **Verif.**   **Gen3 Ist**        **Gen4 "},{"l":3,"t":"2.1.1 Operational Design Domain (ODD) & Use Cases","p":"Source: 01_System_Overview.\n\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014--\n**Industrial Structured**           Defined workspace, known floor\nplan, controlled access. People\noccasionally present.\n\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014-- \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014--\n**Industrial Dynamic**              Shared workspace, moving people,\nvariable layout. People permanently\n**Home**                            Unstructured, vulnerable persons\npossible. Children and elderly;\nnarrow passages.\n\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u20
